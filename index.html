<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>DSD 뷰어 · 모바일 공시 열람기</title>
<style>
:root{
  --fs: 12px;            /* 본문 기준 글자크기(A-/A+로 조절, 초기값=최소) */
  --accent:#1f6feb;
  --bg:#ffffff; --fg:#1a1d21; --muted:#5b6470;
  --card:#ffffff; --line:#d7dde5; --thead:#eef2f7; --hl:#f2f2f2;
  --bar:#ffffffee; --drawer:#ffffff; --shadow:0 8px 30px rgba(0,0,0,.18);
  --topbar-h:52px;
}
body[data-theme="sepia"]{
  --bg:#f4ecd8; --fg:#3b3222; --muted:#6d6144; --card:#faf3e2;
  --line:#d9c9a3; --thead:#ece0c4; --hl:#eaddbf; --bar:#f7efdcee; --drawer:#faf3e2;
}
body[data-theme="dark"]{
  --bg:#0f1216; --fg:#e6e9ee; --muted:#9aa4b1; --card:#161b22;
  --line:#2b333d; --thead:#1c2531; --hl:#232b36; --bar:#12161cee; --drawer:#161b22;
  --shadow:0 8px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,"Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%; line-height:1.55;
  overscroll-behavior-y:none;
}
button{font-family:inherit; cursor:pointer}

/* ===== 상단바 ===== */
.topbar{
  position:sticky; top:0; z-index:40; height:var(--topbar-h);
  display:flex; align-items:center; gap:6px; padding:0 8px;
  background:var(--bar); backdrop-filter:saturate(1.4) blur(8px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar .title{
  flex:1; min-width:0; font-size:15px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center;
}
.iconbtn{
  border:none; background:transparent; color:var(--fg);
  width:40px; height:40px; border-radius:10px; font-size:19px;
  display:flex; align-items:center; justify-content:center;
}
.iconbtn:active{background:var(--hl)}
.iconbtn.small{font-size:14px; font-weight:700; width:auto; padding:0 10px}

/* ===== 본문 ===== */
main{padding:14px 12px 40px; padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.dsd{
  font-size:var(--fs);
  max-width:820px; margin:0 auto;
}
.dsd .cover{
  text-align:center; padding:26px 6px 34px; border-bottom:1px dashed var(--line); margin-bottom:22px;
}
.dsd .p{white-space:pre-wrap; margin:.5em 0}
.dsd h2.sec, .dsd h3.sec{
  scroll-margin-top:calc(var(--topbar-h) + 8px);
  margin:1.4em 0 .7em; line-height:1.35; font-weight:800;
  color:var(--fg);
}
.dsd h2.sec{font-size:1.35em; padding-bottom:.3em; border-bottom:2px solid var(--accent)}
.dsd h3.sec{font-size:1.12em; color:var(--accent)}
.dsd .cover-title{font-size:1.9em; font-weight:800; letter-spacing:.06em; margin:.4em 0}
.pgbrk{height:0; border-top:1px dotted var(--line); margin:22px 0; opacity:.6}

/* ===== 표 ===== */
.tbl-wrap{margin:12px 0; overflow-x:auto; -webkit-overflow-scrolling:touch}
/* border-collapse:separate 로 유지해야 iOS Safari에서 셀 틀고정(sticky)이 동작함 */
.dtbl{border-collapse:separate; border-spacing:0; font-size:.94em; background:var(--card)}
.dtbl.bordered{border-top:1px solid var(--line); border-left:1px solid var(--line)}
.dtbl.bordered td,.dtbl.bordered th{border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.dtbl td,.dtbl th{padding:.34em .5em; vertical-align:middle; word-break:keep-all}
.dtbl th{background:var(--thead); font-weight:700; text-align:center}
.dtbl td.num,.dtbl th.num{font-variant-numeric:tabular-nums; white-space:nowrap}
.dtbl .hlbg{background:var(--hl)}
.dtbl caption{caption-side:top; font-weight:700; padding:4px}

/* 표시 모드 */
.tbl-wrap>.simple{display:none}
.tbl-wrap>.orig{display:table}
body[data-tbl="simple"] .tbl-wrap.hasSimple>.orig{display:none}
body[data-tbl="simple"] .tbl-wrap.hasSimple>.simple{display:table}
/* 원본/맞춤: 자연폭 유지 */
body[data-tbl="orig"] .dtbl.orig, body[data-tbl="fit"] .dtbl.orig{width:var(--natw,auto)}
/* 간략: 화면폭을 채우되, 넓은 금액은 가로 스크롤 */
body[data-tbl="simple"] .tbl-wrap>.simple{min-width:100%; width:max-content}
.dtbl.simple td.num,.dtbl.simple th.num{padding-left:.65em; padding-right:.65em}
.fitscale{transform-origin:left top}

/* ===== 틀고정: 표를 화면폭에 맞춰(가로스크롤 제거) 과목 열을 항상 노출하고,
   머리글 행을 페이지 상단(앱바 아래)에 고정 — 페이지를 세로로 내려도 머리글이 붙어있음 ===== */
body.freeze .tbl-wrap{overflow:visible}
body[data-tbl="fit"].freeze .tbl-wrap{overflow-x:auto} /* '맞춤' 모드와는 함께 쓰지 않음 */
body.freeze .dtbl thead th{
  position:-webkit-sticky; position:sticky;
  top:calc(var(--topbar-h) + env(safe-area-inset-top));
  z-index:20; box-shadow:0 1px 0 var(--line), 0 3px 6px rgba(0,0,0,.08);
}
body.freeze.searchon .dtbl thead th{ top:calc(var(--topbar-h) + 52px + env(safe-area-inset-top)); }

/* ===== 검색 하이라이트 ===== */
mark.hit{background:#ffe27a; color:#000; border-radius:3px}
mark.hit.cur{background:#ff9d3c; box-shadow:0 0 0 2px #ff9d3c}

/* ===== 드로어(목차) ===== */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.42); opacity:0; visibility:hidden;
  transition:opacity .2s; z-index:50}
.scrim.on{opacity:1; visibility:visible}
.drawer{
  position:fixed; top:0; left:0; height:100%; width:min(84vw,340px); z-index:60;
  background:var(--drawer); box-shadow:var(--shadow); transform:translateX(-102%);
  transition:transform .24s cubic-bezier(.2,.7,.2,1); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
.drawer.on{transform:none}
.drawer h4{margin:0; padding:16px 16px 10px; font-size:13px; color:var(--muted); letter-spacing:.04em}
.toc{overflow:auto; padding:0 8px 20px}
.toc a{
  display:block; padding:11px 12px; border-radius:9px; color:var(--fg);
  text-decoration:none; font-size:15px; line-height:1.35;
}
.toc a:active{background:var(--hl)}
.toc a.lv2{padding-left:26px; font-size:14px; color:var(--muted)}
.toc a .en{display:block; font-size:11px; color:var(--muted); margin-top:1px}

/* ===== 설정 바텀시트 ===== */
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--drawer);
  border-radius:18px 18px 0 0; box-shadow:var(--shadow); transform:translateY(102%);
  transition:transform .24s cubic-bezier(.2,.7,.2,1); padding:8px 16px calc(20px + env(safe-area-inset-bottom));
}
.sheet.on{transform:none}
.sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 12px}
.row{display:flex; align-items:center; justify-content:space-between; padding:11px 2px; gap:10px}
.row .lab{font-size:14px; color:var(--muted)}
.seg{display:inline-flex; background:var(--hl); border-radius:10px; padding:3px}
.seg button{border:none; background:transparent; color:var(--fg); padding:7px 12px; border-radius:8px; font-size:13px; font-weight:600}
.seg button.on{background:var(--accent); color:#fff}
.stepper{display:inline-flex; align-items:center; gap:4px}
.stepper button{width:38px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:17px; font-weight:700}

/* ===== 검색바 ===== */
.searchbar{
  position:sticky; top:var(--topbar-h); z-index:35; display:none; gap:6px; align-items:center;
  padding:8px 10px; background:var(--bar); border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
}
.searchbar.on{display:flex}
.searchbar input{
  flex:1; min-width:0; border:1px solid var(--line); background:var(--card); color:var(--fg);
  border-radius:10px; padding:9px 12px; font-size:15px; outline:none;
}
.searchbar .cnt{font-size:12px; color:var(--muted); min-width:52px; text-align:center}

/* ===== 랜딩(파일 없음) ===== */
.land{max-width:560px; margin:6vh auto; padding:0 18px; text-align:center}
.logo{font-size:44px; margin-bottom:6px}
.land h1{font-size:22px; margin:.2em 0}
.land p{color:var(--muted); font-size:14px; line-height:1.7}
.drop{
  margin:22px 0; border:2px dashed var(--line); border-radius:16px; padding:30px 18px;
  background:var(--card); transition:border-color .15s,background .15s;
}
.drop.hot{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.btn{
  display:inline-block; background:var(--accent); color:#fff; border:none; border-radius:11px;
  padding:12px 20px; font-size:15px; font-weight:700; margin:6px 4px;
}
.btn.ghost{background:transparent; color:var(--accent); border:1.5px solid var(--accent)}
.hint{font-size:12.5px; color:var(--muted); margin-top:12px}
.hidden{display:none!important}
.meta{font-size:12px; color:var(--muted); text-align:center; margin:2px 0 16px}
.err{color:#d64545; font-size:13px; margin-top:10px; white-space:pre-wrap}
</style>
</head>
<body data-theme="light" data-tbl="simple" class="freeze">

<!-- 상단바 -->
<header class="topbar" id="topbar">
  <button class="iconbtn" id="btnToc" title="목차" aria-label="목차">☰</button>
  <div class="title" id="docTitle">DSD 뷰어</div>
  <button class="iconbtn" id="btnSearch" title="검색" aria-label="검색">🔍</button>
  <button class="iconbtn small" id="btnSettings" title="보기설정">Aa</button>
</header>

<!-- 검색바 -->
<div class="searchbar" id="searchbar">
  <input id="searchInput" type="search" placeholder="본문에서 찾기…" enterkeyhint="search" autocomplete="off">
  <span class="cnt" id="searchCnt">0/0</span>
  <button class="iconbtn" id="searchPrev" aria-label="이전">▲</button>
  <button class="iconbtn" id="searchNext" aria-label="다음">▼</button>
  <button class="iconbtn" id="searchClose" aria-label="닫기">✕</button>
</div>

<main>
  <!-- 랜딩 -->
  <section class="land" id="landing">
    <div class="logo">📑</div>
    <h1>모바일 공시(DSD) 뷰어</h1>
    <p>금감원 DART 편집기 문서(<b>.dsd</b>)를 스마트폰에서 편하게 읽습니다.<br>
       인코딩·넓은 표를 자동으로 모바일에 맞춰 보여줘요.</p>
    <div class="drop" id="drop">
      <div style="font-size:30px">⬆️</div>
      <div style="margin:8px 0 2px; font-weight:700">여기로 파일을 끌어놓거나</div>
      <button class="btn" id="btnPick">파일 선택</button>
      <button class="btn ghost" id="btnSample">샘플 문서 보기</button>
      <!-- accept 를 두지 않는다. iOS(아이폰·아이패드)는 accept 의 확장자를 애플의 파일 타입(UTI)
           으로 해석하는데 .dsd 는 등록된 타입이 아니어서, accept 가 있으면 파일 앱에서 .dsd 가
           회색으로 비활성화돼 아예 선택할 수 없다. 파일 종류는 openBytesU8 이 ZIP 서명(PK)과
           확장자로 직접 판별하므로 accept 없이도 안전하다. -->
      <input type="file" id="fileInput" class="hidden">
      <div class="hint">지원: .dsd (DART 원본) · contents.xml · DART 내보내기 .htm</div>
    </div>
    <div class="err" id="landErr"></div>
    <p class="hint">모든 처리는 이 기기 안에서만 이뤄집니다. 파일은 어디에도 업로드되지 않아요.</p>
  </section>

  <!-- 문서 -->
  <div id="docHost"></div>
</main>

<!-- 목차 드로어 -->
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="목차">
  <h4>목차</h4>
  <div class="toc" id="tocList"></div>
</nav>

<!-- 설정 시트 -->
<div class="scrim" id="scrim2"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="보기 설정">
  <div class="grab"></div>
  <div class="row">
    <span class="lab">글자 크기</span>
    <span class="stepper"><button id="fsDown">A−</button><button id="fsUp">A＋</button></span>
  </div>
  <div class="row">
    <span class="lab">테마</span>
    <span class="seg" id="segTheme">
      <button data-v="light" class="on">밝게</button>
      <button data-v="sepia">세피아</button>
      <button data-v="dark">어둡게</button>
    </span>
  </div>
  <div class="row">
    <span class="lab">표 보기</span>
    <span class="seg" id="segTbl">
      <button data-v="simple" class="on">간략</button>
      <button data-v="orig">원본</button>
      <button data-v="fit">맞춤</button>
    </span>
  </div>
  <div class="row">
    <span class="lab">틀고정 <small style="opacity:.7">(머리글·과목 고정)</small></span>
    <span class="seg" id="segFreeze">
      <button data-v="off">끄기</button>
      <button data-v="on" class="on">켜기</button>
    </span>
  </div>
  <div class="row" style="border-top:1px solid var(--line); margin-top:4px">
    <span class="lab">다른 문서 열기</span>
    <button class="btn" style="padding:9px 16px; font-size:14px" id="btnOpenNew">파일 선택</button>
  </div>
  <div style="text-align:center; font-size:11px; color:var(--muted); padding:6px 0 2px">
    DSD 뷰어 · 빌드 <b>r8</b> · 2026-07-14
  </div>
</div>

<script>
"use strict";
const $=(s)=>document.querySelector(s);
const body=document.body;

/* ---------- 유틸: 인코딩 감지 디코딩(평문 xml/htm용) ---------- */
function decodeBytes(u8){
  // BOM
  if(u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF) return new TextDecoder('utf-8').decode(u8);
  // meta/xml 선언에서 charset 추출(앞부분을 latin1로 훑기)
  const head=new TextDecoder('latin1').decode(u8.slice(0,2048)).toLowerCase();
  let cs=null;
  let m=head.match(/encoding=["']?([\w-]+)/) || head.match(/charset=["']?([\w-]+)/);
  if(m) cs=m[1];
  if(!cs){
    // utf-8로 시도해 치환문자 비율이 높으면 euc-kr로 폴백
    const t=new TextDecoder('utf-8',{fatal:false}).decode(u8);
    const bad=(t.match(/�/g)||[]).length;
    if(bad>3) cs='euc-kr'; else return t;
  }
  try{ return new TextDecoder(cs).decode(u8); }
  catch(e){ return new TextDecoder('utf-8').decode(u8); }
}

/* ---------- USERMARK 스타일 해석 ---------- */
function umStyle(um){
  if(!um) return '';
  let css=''; let hl=false;
  um.trim().split(/\s+/).forEach(tok=>{
    let m;
    if(m=tok.match(/^F-BT(\d+)$/i)){ css+=`font-size:${(+m[1]/10).toFixed(2)}em;font-weight:700;`; }
    else if(m=tok.match(/^F-(\d+)$/i)){ css+=`font-size:${(+m[1]/10).toFixed(2)}em;`; }
    else if(/^B$/i.test(tok)){ css+='font-weight:700;'; }
    else if(/^I$/i.test(tok)){ css+='font-style:italic;'; }
    else if(/^U$/i.test(tok)){ css+='text-decoration:underline;'; }
    else if(m=tok.match(/^BC0X([0-9a-f]{6})$/i)){ hl=true; }
    else if(m=tok.match(/^FC0X([0-9a-f]{6})$/i)){ css+=`color:#${m[1]};`; }
  });
  return {css, hl};
}

/* ---------- 인라인 텍스트 → HTML (&cr; 줄바꿈, SPAN 보존) ---------- */
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/&amp;cr;/g,'<br>');
}
function inlineHTML(node){
  let h='';
  node.childNodes.forEach(c=>{
    if(c.nodeType===3){ h+=esc(c.nodeValue); }
    else if(c.nodeType===1){
      const t=c.tagName.toUpperCase();
      if(t==='SPAN'){
        const st=umStyle(c.getAttribute('USERMARK'));
        h+=`<span style="${st.css}${st.hl?'background:var(--hl);':''}">${inlineHTML(c)}</span>`;
      } else if(t==='BR'||t==='PGBRK'){ h+='<br>'; }
      else { h+=inlineHTML(c); }
    }
  });
  return h;
}
function plainText(node){ return (node.textContent||'').replace(/　/g,' ').trim(); }

/* ---------- 셀 생성 ---------- */
function buildCell(cell){
  const tag=cell.tagName.toUpperCase();
  const isHead=tag==='TH';
  const el=document.createElement(isHead?'th':'td');
  const cs=cell.getAttribute('COLSPAN'), rs=cell.getAttribute('ROWSPAN');
  if(cs&&+cs>1) el.colSpan=+cs;
  if(rs&&+rs>1) el.rowSpan=+rs;
  const align=(cell.getAttribute('ALIGN')||'').toLowerCase();
  if(align) el.style.textAlign=align;
  const va=(cell.getAttribute('VALIGN')||'').toLowerCase();
  if(va) el.style.verticalAlign=(va==='middle'?'middle':va);
  const st=umStyle(cell.getAttribute('USERMARK'));
  if(st.css) el.setAttribute('style', el.getAttribute('style')+';'+st.css);
  if(st.hl) el.classList.add('hlbg');
  // 계정 들여쓰기(ALEVEL)
  const lv=cell.getAttribute('ALEVEL');
  if(lv!=null && (align===''||align==='left')) el.style.paddingLeft=(6+(+lv||0)*14)+'px';
  // 숫자열 표시
  if(align==='right') el.classList.add('num');
  el.innerHTML=inlineHTML(cell)||'';
  return el;
}

/* ---------- 재무표 간략화(숫자 소분열 병합) ---------- */
function nonblank(cell){
  const t=(cell.textContent||'').replace(/[　\s]/g,'');
  return t.length?cell:null;
}
function buildSimple(tableEl, colCount){
  // colCount = 열 수. label 1 + pairs*2 가정
  const pairs=(colCount-1)/2;
  const t=document.createElement('table');
  t.className='dtbl simple'+ (tableEl.getAttribute('BORDER')==='1'?' bordered':'');
  // 헤더: THEAD 활용
  const thead=tableEl.querySelector('THEAD');
  const tr=document.createElement('tr');
  let periodLabels=[];
  if(thead){
    const ths=[...thead.querySelectorAll('TH')];
    if(ths.length){
      // 첫 TH=과목, COLSPAN>=2 인 TH들=기간
      const labTh=document.createElement('th'); labTh.innerHTML=inlineHTML(ths[0]); tr.appendChild(labTh);
      const grp=ths.slice(1).filter(x=>(+(x.getAttribute('COLSPAN')||1))>=2);
      if(grp.length===pairs){ periodLabels=grp.map(x=>inlineHTML(x)); }
    }
  }
  if(!periodLabels.length){
    // 폴백 라벨
    const labTh=document.createElement('th'); labTh.textContent='과목'; tr.appendChild(labTh);
    for(let p=0;p<pairs;p++) periodLabels.push(p===0?'당기':(p===1?'전기':'제'+(p+1)+'기'));
  }
  periodLabels.forEach(lbl=>{ const th=document.createElement('th'); th.className='num'; th.innerHTML=lbl; tr.appendChild(th); });
  const thd=document.createElement('thead'); thd.appendChild(tr); t.appendChild(thd);
  // 본문
  const tb=document.createElement('tbody');
  const bodyTrs=[...tableEl.querySelectorAll('TBODY>TR')];
  bodyTrs.forEach(row=>{
    const cells=[...row.children].filter(c=>/^(TE|TD|TH|TU)$/i.test(c.tagName));
    if(!cells.length) return;
    const ntr=document.createElement('tr');
    // 전체 병합행(단일 셀 COLSPAN) 처리
    const firstCsRaw=+(cells[0].getAttribute('COLSPAN')||1);
    if(cells.length===1 && firstCsRaw>=colCount){
      const td=buildCell(cells[0]); td.colSpan=1+pairs; ntr.appendChild(td); tb.appendChild(ntr); return;
    }
    // 라벨
    const lab=buildCell(cells[0]); ntr.appendChild(lab);
    // 각 기간: 두 소분열 중 값 있는 것
    let idx=1;
    for(let p=0;p<pairs;p++){
      const a=cells[idx], b=cells[idx+1]; idx+=2;
      const pick=(a&&nonblank(a))||(b&&nonblank(b))||a||b;
      const td=document.createElement('td'); td.className='num'; td.style.textAlign='right';
      td.innerHTML= pick? inlineHTML(pick) : '';
      ntr.appendChild(td);
    }
    tb.appendChild(ntr);
  });
  t.appendChild(tb);
  return t;
}

/* ---------- 표 ---------- */
function renderTable(el){
  const wrap=document.createElement('div'); wrap.className='tbl-wrap';
  const table=document.createElement('table');
  const border=el.getAttribute('BORDER')==='1';
  table.className='dtbl orig'+(border?' bordered':'');
  const natW=+(el.getAttribute('WIDTH')||0);
  if(natW) table.style.setProperty('--natw', natW+'px');
  // colgroup
  const cg=el.querySelector('COLGROUP');
  let colCount=0;
  if(cg){
    const ncg=document.createElement('colgroup');
    [...cg.querySelectorAll('COL')].forEach(c=>{
      const col=document.createElement('col'); const w=c.getAttribute('WIDTH');
      if(w) col.style.width=w+'px'; ncg.appendChild(col); colCount++;
    });
    table.appendChild(ncg);
  }
  // 섹션
  ['THEAD','TBODY','TFOOT'].forEach(secName=>{
    el.querySelectorAll(secName).forEach(sec=>{
      const nsec=document.createElement(secName.toLowerCase());
      sec.querySelectorAll('TR').forEach(tr=>{
        const ntr=document.createElement('tr');
        [...tr.children].forEach(c=>{ if(/^(TD|TH|TE|TU)$/i.test(c.tagName)) ntr.appendChild(buildCell(c)); });
        nsec.appendChild(ntr);
      });
      table.appendChild(nsec);
    });
  });
  // THEAD/TBODY 없이 TR 직속인 경우
  if(!el.querySelector('THEAD,TBODY,TFOOT')){
    const tb=document.createElement('tbody');
    el.querySelectorAll('TR').forEach(tr=>{
      const ntr=document.createElement('tr');
      [...tr.children].forEach(c=>{ if(/^(TD|TH|TE|TU)$/i.test(c.tagName)) ntr.appendChild(buildCell(c)); });
      tb.appendChild(ntr);
    });
    table.appendChild(tb);
  }
  wrap.appendChild(table);
  // 재무표 간략본
  const cls=el.getAttribute('ACLASS')||'';
  try{
    if(/FINANCE/i.test(cls) && colCount>=3 && (colCount-1)%2===0){
      const simple=buildSimple(el,colCount);
      wrap.appendChild(simple); wrap.classList.add('hasSimple');
    }
  }catch(e){ /* 간략 생성 실패 시 원본만 */ }
  return wrap;
}

/* ---------- 문서 워커 ---------- */
// INSERTION/LIBRARY 는 실제 삽입 콘텐츠(재무제표 등)를 감싸는 '투명' 컨테이너 → 숨기지 말고 내부 재귀.
// 지시자/메타 자식(COMMENT/LIBRARYLIST/FILENAME/WARNING 등)만 숨긴다.
const HIDE=new Set(['DOCUMENT-HEADER','SUMMARY','EXTRACTION','FORMULA-VERSION','COMPANY-NAME','DOCUMENT-NAME',
  'COMMENT','LIBRARYLIST','FILENAME','WARNING','TOC','METAINFO','META-INFO']);
const TRANSPARENT=new Set(['INSERTION','LIBRARY']);
let tocItems=[];

function walk(node, parent){
  node.childNodes.forEach(c=>{
    if(c.nodeType===3){
      const tx=c.nodeValue;
      if(tx && tx.trim()){ const s=document.createElement('span'); s.innerHTML=esc(tx); parent.appendChild(s); }
      return;
    }
    if(c.nodeType!==1) return;
    const t=c.tagName.toUpperCase();
    if(HIDE.has(t)) return;
    if(TRANSPARENT.has(t)){ walk(c,parent); return; }
    switch(t){
      case 'COVER':{
        const d=document.createElement('div'); d.className='cover'; walk(c,d); parent.appendChild(d); break;
      }
      case 'COVER-TITLE':{
        const h=document.createElement('div'); h.className='cover-title';
        h.innerHTML=inlineHTML(c); tagToc(c,h,'cover'); parent.appendChild(h); break;
      }
      case 'TITLE':{
        const isMain=(c.getAttribute('ATOC')==='Y');
        const h=document.createElement(isMain?'h2':'h3'); h.className='sec';
        h.innerHTML=inlineHTML(c); tagToc(c,h,isMain?'main':'sub'); parent.appendChild(h); break;
      }
      case 'SECTION-1': case 'SECTION-2': case 'TABLE-GROUP': case 'THEAD-GROUP':{
        const d=document.createElement('div'); walk(c,d); parent.appendChild(d); break;
      }
      case 'TABLE':{ parent.appendChild(renderTable(c)); break; }
      case 'P':{
        const p=document.createElement('p'); p.className='p';
        const st=umStyle(c.getAttribute('USERMARK'));
        if(st.css) p.setAttribute('style',st.css);
        p.innerHTML=inlineHTML(c); parent.appendChild(p); break;
      }
      case 'PGBRK':{ const d=document.createElement('div'); d.className='pgbrk'; parent.appendChild(d); break; }
      case 'SPAN':{ const s=document.createElement('span');
        const st=umStyle(c.getAttribute('USERMARK')); s.setAttribute('style',st.css); s.innerHTML=inlineHTML(c);
        parent.appendChild(s); break; }
      default:{ /* 알 수 없는 컨테이너는 내용만 재귀 */ walk(c,parent); }
    }
  });
}
let tocSeq=0;
function tagToc(srcEl,domEl,kind){
  const id='sec-'+(++tocSeq);
  domEl.id=id;
  const title=plainText(srcEl).replace(/\s+/g,' ');
  if(!title) return;
  tocItems.push({id, title, en:(srcEl.getAttribute('ENG')||'').trim(),
    main:(kind==='cover'||kind==='main')});
}

/* ---------- 파싱 진입 ---------- */
function parseDART(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,'application/xml');
  const perr=doc.querySelector('parsererror');
  if(perr) throw new Error('문서 구문 분석 실패: '+ (perr.textContent||'').slice(0,120));
  return doc;
}
function docTitleFrom(doc){
  const name=doc.querySelector('DOCUMENT-NAME'); const comp=doc.querySelector('COMPANY-NAME');
  const parts=[]; if(comp) parts.push(plainText(comp)); if(name) parts.push(plainText(name));
  return parts.join(' · ')||'DSD 문서';
}

function renderDoc(xmlText){
  tocItems=[]; tocSeq=0;
  const doc=parseDART(xmlText);
  const root=doc.querySelector('BODY')||doc.documentElement;
  const host=document.createElement('div'); host.className='dsd';
  walk(root, host);
  // 화면 반영
  const dh=$('#docHost'); dh.innerHTML=''; dh.appendChild(host);
  $('#landing').classList.add('hidden');
  const title=docTitleFrom(doc);
  $('#docTitle').textContent=title;
  document.title=title+' · DSD 뷰어';
  buildToc();
  if(body.dataset.tbl==='fit') applyFit();
  if(body.classList.contains('freeze')) requestAnimationFrame(fitFreeze);
  window.scrollTo(0,0);
}

/* ---------- 목차 UI ---------- */
function buildToc(){
  const list=$('#tocList'); list.innerHTML='';
  if(!tocItems.length){ list.innerHTML='<div style="padding:12px;color:var(--muted);font-size:13px">목차 항목이 없습니다.</div>'; return; }
  tocItems.forEach(it=>{
    const a=document.createElement('a'); a.href='#'+it.id; a.className=it.main?'lv1':'lv2';
    a.innerHTML=`<span>${it.title}</span>`+(it.en?`<span class="en">${it.en}</span>`:'');
    a.addEventListener('click',(e)=>{ e.preventDefault(); closeDrawer();
      const el=document.getElementById(it.id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
    list.appendChild(a);
  });
}

/* ---------- 파일 로딩 ---------- */
function openBytesU8(buf, rawName){
  $('#landErr').textContent='';
  try{
    const name=(rawName||'').toLowerCase();
    if(name.endsWith('.dsd') || (buf[0]===0x50&&buf[1]===0x4B)){ // ZIP(PK)
      const files=fflate.unzipSync(buf);
      const key=Object.keys(files).find(k=>/contents\.xml$/i.test(k)) || Object.keys(files).find(k=>/\.xml$/i.test(k));
      if(!key) throw new Error('.dsd 안에서 contents.xml을 찾지 못했습니다.');
      renderDoc(decodeBytes(files[key]));
    } else if(name.endsWith('.htm')||name.endsWith('.html')){
      renderHTMLdoc(decodeBytes(buf), rawName);
    } else { // .xml 등
      renderDoc(decodeBytes(buf));
    }
  }catch(err){
    console.error(err);
    $('#landErr').textContent='열기 실패: '+err.message;
    $('#landing').classList.remove('hidden');
  }
}
async function loadFile(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  openBytesU8(buf, file.name||'');
}
/* 네이티브(안드로이드 WebView)에서 파일 바이트를 base64로 전달받는 진입점 */
window.openBytes=function(b64, name){
  try{
    const bin=atob(b64); const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    openBytesU8(u8, name||'document.dsd');
  }catch(e){
    $('#landErr').textContent='파일 열기 실패: '+e.message;
    $('#landing').classList.remove('hidden');
  }
};

/* DART 내보내기 .htm(표준 HTML) — 모바일 오버레이로 표시 */
function renderHTMLdoc(htmlText, fname){
  const parsed=new DOMParser().parseFromString(htmlText,'text/html');
  parsed.querySelectorAll('script,link[rel=stylesheet],style').forEach(n=>n.remove());
  const host=document.createElement('div'); host.className='dsd htmlmode';
  host.innerHTML=parsed.body?parsed.body.innerHTML:htmlText;
  host.querySelectorAll('table').forEach(tb=>{
    const w=document.createElement('div'); w.className='tbl-wrap';
    tb.parentNode.insertBefore(w,tb); w.appendChild(tb); tb.classList.add('orig');
  });
  const dh=$('#docHost'); dh.innerHTML=''; dh.appendChild(host);
  $('#landing').classList.add('hidden');
  // 목차: 표준 제목/굵은줄 휴리스틱
  tocItems=[]; tocSeq=0;
  host.querySelectorAll('h1,h2,h3,h4').forEach(h=>{ const id='sec-'+(++tocSeq); h.id=id; h.classList.add('sec');
    tocItems.push({id,title:(h.textContent||'').trim().slice(0,60),en:'',main:true}); });
  $('#docTitle').textContent=fname||'DSD 문서';
  buildToc();
}

/* ---------- 표 '맞춤' 스케일 ---------- */
function applyFit(){
  const wraps=document.querySelectorAll('.tbl-wrap');
  wraps.forEach(w=>{
    const t=w.querySelector('.orig'); if(!t) return;
    t.classList.remove('fitscale'); t.style.transform=''; w.style.height='';
    const avail=w.clientWidth||document.documentElement.clientWidth-24;
    const nat=t.scrollWidth;
    if(nat>avail){
      const k=avail/nat;
      t.classList.add('fitscale'); t.style.transform='scale('+k.toFixed(3)+')';
      w.style.height=(t.scrollHeight*k)+'px'; w.style.overflow='hidden';
    }
  });
}
function clearFit(){
  document.querySelectorAll('.tbl-wrap .orig.fitscale').forEach(t=>{ t.classList.remove('fitscale'); t.style.transform=''; });
  document.querySelectorAll('.tbl-wrap').forEach(w=>{ w.style.height=''; });
}

/* ---------- 틀고정: 표를 화면폭에 맞춰 글자크기 축소(가로스크롤 제거) ---------- */
function clearFreezeFit(){
  document.querySelectorAll('#docHost .dtbl').forEach(t=>{ t.style.fontSize=''; });
  document.querySelectorAll('#docHost .tbl-wrap').forEach(w=>{ w.style.overflowX=''; });
}
function fitFreeze(){
  if(!body.classList.contains('freeze') || body.dataset.tbl==='fit'){ clearFreezeFit(); return; }
  const MIN=0.55;   // 이보다 더 줄여야 하는 아주 넓은 표는 축소 대신 그 표만 가로스크롤
  document.querySelectorAll('#docHost .tbl-wrap').forEach(w=>{
    // 현재 보이는 표(간략/원본)를 computed display 로 안정적으로 선택
    const tables=[...w.querySelectorAll(':scope>table')];
    const t=tables.find(x=>getComputedStyle(x).display!=='none') || tables[0];
    if(!t) return;
    t.style.fontSize=''; w.style.overflowX='visible';       // 초기화 후 자연폭 측정
    const avail=w.clientWidth-2, nat=t.scrollWidth;
    if(nat>avail && avail>0){
      const raw=avail/nat;
      if(raw>=MIN){ t.style.fontSize=(0.94*raw*0.985).toFixed(3)+'em'; }
      else { t.style.fontSize=(0.94*MIN).toFixed(3)+'em'; w.style.overflowX='auto'; }
    }
  });
}

/* ---------- 검색 ---------- */
let hits=[], curHit=-1;
function clearMarks(){
  document.querySelectorAll('#docHost mark.hit').forEach(m=>{ const t=document.createTextNode(m.textContent); m.replaceWith(t); });
  document.querySelectorAll('#docHost').forEach(h=>h.normalize());
  hits=[]; curHit=-1; $('#searchCnt').textContent='0/0';
}
function runSearch(q){
  clearMarks(); if(!q||q.length<1) return;
  const host=$('#docHost'); const rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const walker=document.createTreeWalker(host, NodeFilter.SHOW_TEXT, {
    acceptNode:(n)=> n.nodeValue && rx.test(n.nodeValue) && n.parentElement && n.parentElement.offsetParent!==null
      ? NodeFilter.FILTER_ACCEPT: NodeFilter.FILTER_REJECT });
  const targets=[]; let n; while(n=walker.nextNode()) targets.push(n);
  targets.forEach(node=>{
    const frag=document.createDocumentFragment(); let last=0; const s=node.nodeValue; rx.lastIndex=0; let m;
    while(m=rx.exec(s)){
      if(m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const mk=document.createElement('mark'); mk.className='hit'; mk.textContent=m[0]; frag.appendChild(mk); hits.push(mk);
      last=m.index+m[0].length; if(m[0].length===0) rx.lastIndex++;
    }
    if(last<s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    node.replaceWith(frag);
  });
  if(hits.length){ curHit=0; focusHit(); }
  $('#searchCnt').textContent=(hits.length?1:0)+'/'+hits.length;
}
function focusHit(){
  hits.forEach(h=>h.classList.remove('cur'));
  if(curHit<0||!hits[curHit]) return;
  const h=hits[curHit]; h.classList.add('cur'); h.scrollIntoView({behavior:'smooth',block:'center'});
  $('#searchCnt').textContent=(curHit+1)+'/'+hits.length;
}

/* ---------- UI 배선 ---------- */
function openDrawer(){ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }
function openSheet(){ $('#sheet').classList.add('on'); $('#scrim2').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim2').classList.remove('on'); }

$('#btnToc').onclick=openDrawer;
$('#scrim').onclick=closeDrawer;
$('#btnSettings').onclick=openSheet;
$('#scrim2').onclick=closeSheet;

$('#btnSearch').onclick=()=>{ const sb=$('#searchbar'); sb.classList.toggle('on');
  body.classList.toggle('searchon', sb.classList.contains('on'));
  if(sb.classList.contains('on')){ $('#searchInput').focus(); } else { clearMarks(); } };
$('#searchClose').onclick=()=>{ $('#searchbar').classList.remove('on'); body.classList.remove('searchon'); clearMarks(); $('#searchInput').value=''; };
let searchT; $('#searchInput').addEventListener('input',e=>{ clearTimeout(searchT); const v=e.target.value; searchT=setTimeout(()=>runSearch(v),200); });
$('#searchInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(hits.length){ curHit=(curHit+1)%hits.length; focusHit(); } } });
$('#searchNext').onclick=()=>{ if(hits.length){ curHit=(curHit+1)%hits.length; focusHit(); } };
$('#searchPrev').onclick=()=>{ if(hits.length){ curHit=(curHit-1+hits.length)%hits.length; focusHit(); } };

/* 글자크기 */
let fsPx=12;
function setFs(px){ fsPx=Math.max(12,Math.min(28,px)); document.documentElement.style.setProperty('--fs',fsPx+'px');
  if(body.dataset.tbl==='fit') requestAnimationFrame(applyFit);
  if(body.classList.contains('freeze')) requestAnimationFrame(fitFreeze); }
$('#fsUp').onclick=()=>setFs(fsPx+1);
$('#fsDown').onclick=()=>setFs(fsPx-1);

/* 테마/표모드 세그먼트 */
$('#segTheme').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  [...$('#segTheme').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  body.dataset.theme=b.dataset.v; document.querySelector('meta[name=theme-color]').content = getComputedStyle(body).getPropertyValue('--bar').trim(); });
$('#segTbl').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  [...$('#segTbl').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  body.dataset.tbl=b.dataset.v;
  if(b.dataset.v==='fit') requestAnimationFrame(applyFit); else clearFit();
  requestAnimationFrame(fitFreeze); });

/* 틀고정 토글 */
$('#segFreeze').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  [...$('#segFreeze').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  body.classList.toggle('freeze', b.dataset.v==='on');
  requestAnimationFrame(fitFreeze); });

/* 파일 선택/드롭 */
$('#btnPick').onclick=()=>$('#fileInput').click();
$('#btnOpenNew').onclick=()=>{ closeSheet(); $('#fileInput').click(); };
$('#fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadFile(f); e.target.value=''; });
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.add('hot');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.remove('hot');}));
drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) loadFile(f); });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ if(e.target.closest('#drop')) return; e.preventDefault(); const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) loadFile(f); });

/* 샘플 */
$('#btnSample').onclick=()=>{ try{ renderDoc(window.SAMPLE_DSD); }catch(e){ $('#landErr').textContent='샘플 로드 실패: '+e.message; } };

/* 방향전환/리사이즈 시 맞춤 재계산 */
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  if(body.dataset.tbl==='fit') applyFit();
  if(body.classList.contains('freeze')) fitFreeze();
},150); });

setFs(12);
